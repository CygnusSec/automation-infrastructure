---
# Customer/environment variables.
# Keep secrets out of git; store per-customer secrets in
# inventories/customer-a/secrets/.

target_os_family: "{{ lookup('env', 'ANSIBLE_TARGET_OS_FAMILY') | default('Debian', true) }}"
target_distribution: "{{ lookup('env', 'ANSIBLE_TARGET_DISTRIBUTION') | default('Ubuntu', true) }}"

prerequisite_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - net-tools
  - openssh-client
  - python3
  - python3-apt
  - python3-pip
  - rsync
  - sshpass
  - telnet
  - traceroute
  - unzip
  - vim
  - wget

prerequisite_sysctl:
  net.ipv4.ip_local_port_range: "1024 65535"
  fs.file-max: "5000000"

prerequisite_limits:
  - "* soft nproc 65535"
  - "* hard nproc 65535"
  - "* soft nofile 65535"
  - "* hard nofile 65535"

prerequisite_disable_swap: "{{ (lookup('env', 'ANSIBLE_PREREQUISITE_DISABLE_SWAP') | default('true', true)) | bool }}"
prerequisite_disable_ufw: "{{ (lookup('env', 'ANSIBLE_PREREQUISITE_DISABLE_UFW') | default('false', true)) | bool }}"
prerequisite_timezone: "{{ lookup('env', 'ANSIBLE_PREREQUISITE_TIMEZONE') | default('', true) }}"

# Target hosts run Ubuntu 24.04. Offline .deb files must be downloaded for
# Ubuntu 24.04 (noble) and the target architecture, usually amd64.
prerequisite_install_from_local_repo: "{{ (lookup('env', 'ANSIBLE_PREREQUISITE_INSTALL_FROM_LOCAL_REPO') | default('true', true)) | bool }}"
prerequisite_repo_source: "{{ lookup('env', 'ANSIBLE_PREREQUISITE_REPO_SOURCE') | default('./repo/prerequisite', true) }}"
prerequisite_repo_dest: "{{ lookup('env', 'ANSIBLE_PREREQUISITE_REPO_DEST') | default('/media/installation/prerequisite', true) }}"

docker_install_from_local_repo: "{{ (lookup('env', 'ANSIBLE_DOCKER_INSTALL_FROM_LOCAL_REPO') | default('true', true)) | bool }}"
docker_repo_source: "{{ lookup('env', 'ANSIBLE_DOCKER_REPO_SOURCE') | default('./repo/docker', true) }}"
docker_repo_dest: "{{ lookup('env', 'ANSIBLE_DOCKER_REPO_DEST') | default('/media/installation/docker', true) }}"
docker_packages:
  - docker.io
  - docker-compose-v2
docker_users:
  - "{{ ansible_user }}"

# SSH bootstrap.
ssh_copy_id_public_key_file: "{{ lookup('env', 'ANSIBLE_SSH_COPY_ID_PUBLIC_KEY_FILE') | default(ansible_ssh_private_key_file ~ '.pub', true) }}"
ssh_copy_id_target_group: "{{ lookup('env', 'ANSIBLE_SSH_COPY_ID_TARGET_GROUP') | default('ssh_copy_id_targets', true) }}"

# Zabbix agent role
zabbix_agent_enabled: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_ENABLED') | default('false', true)) | bool }}"
zabbix_agent_target_group: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_TARGET_GROUP') | default('linux', true) }}"
zabbix_agent_install_from_local_repo: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_INSTALL_FROM_LOCAL_REPO') | default('false', true)) | bool }}"
zabbix_agent_repo_source: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_REPO_SOURCE') | default('./repo/zabbix', true) }}"
zabbix_agent_repo_dest: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_REPO_DEST') | default('/media/installation/zabbix', true) }}"
zabbix_agent_manage_apt_repo: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_MANAGE_APT_REPO') | default('true', true)) | bool }}"
zabbix_agent_release_url: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_RELEASE_URL') | default('https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb', true) }}"
zabbix_agent_release_package_path: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_RELEASE_PACKAGE_PATH') | default('/tmp/zabbix-release_latest_7.0+ubuntu24.04_all.deb', true) }}"
zabbix_agent_packages: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_PACKAGES') | default('[zabbix-agent2, zabbix-agent2-plugin-mongodb, zabbix-agent2-plugin-mssql, zabbix-agent2-plugin-postgresql]', true) | from_yaml }}"
zabbix_agent_service_name: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_SERVICE_NAME') | default('zabbix-agent2', true) }}"
zabbix_agent_config_file: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_CONFIG_FILE') | default('/etc/zabbix/zabbix_agent2.conf', true) }}"
zabbix_agent_server_host: "{{ lookup('env', 'ANSIBLE_ZABBIX_SERVER_HOST') | default('', true) }}"
zabbix_agent_server_active: "{{ lookup('env', 'ANSIBLE_ZABBIX_SERVER_ACTIVE') | default(zabbix_agent_server_host, true) }}"
zabbix_agent_hostname: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_HOSTNAME') | default(ansible_hostname | default(inventory_hostname), true) }}"
zabbix_agent_remove_legacy_agent: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_REMOVE_LEGACY_AGENT') | default('true', true)) | bool }}"
zabbix_agent_legacy_packages: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_LEGACY_PACKAGES') | default('[zabbix-agent]', true) | from_yaml }}"
zabbix_agent_legacy_services: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_LEGACY_SERVICES') | default('[zabbix-agent]', true) | from_yaml }}"
zabbix_agent_uninstall_packages: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_UNINSTALL_PACKAGES') | default((zabbix_agent_packages + ['zabbix-agent']) | unique | to_yaml, true) | from_yaml }}"
zabbix_agent_uninstall_services: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_UNINSTALL_SERVICES') | default('[zabbix-agent2, zabbix-agent]', true) | from_yaml }}"
zabbix_agent_uninstall_purge: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_UNINSTALL_PURGE') | default('true', true)) | bool }}"
zabbix_agent_uninstall_autoremove: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_UNINSTALL_AUTOREMOVE') | default('true', true)) | bool }}"
zabbix_agent_uninstall_remove_local_repo: "{{ (lookup('env', 'ANSIBLE_ZABBIX_AGENT_UNINSTALL_REMOVE_LOCAL_REPO') | default('false', true)) | bool }}"

# Dockerized DNS and time server role
dns_time_services_enabled: "{{ (lookup('env', 'ANSIBLE_DNS_TIME_SERVICES_ENABLED') | default('false', true)) | bool }}"
dns_time_services_target_group: "{{ lookup('env', 'ANSIBLE_DNS_TIME_SERVICES_TARGET_GROUP') | default('dns_time_servers', true) }}"
dns_time_services_load_images: "{{ (lookup('env', 'ANSIBLE_DNS_TIME_SERVICES_LOAD_IMAGES') | default('true', true)) | bool }}"
dns_time_services_base_dir: "{{ lookup('env', 'ANSIBLE_DNS_TIME_SERVICES_BASE_DIR') | default('/opt/ansible-dns-time', true) }}"
dns_server_enabled: "{{ (lookup('env', 'ANSIBLE_DNS_SERVER_ENABLED') | default('true', true)) | bool }}"
dns_server_image: "{{ lookup('env', 'ANSIBLE_DNS_SERVER_IMAGE') | default('local/bind9:offline', true) }}"
dns_server_image_tar: "{{ lookup('env', 'ANSIBLE_DNS_SERVER_IMAGE_TAR') | default('./repo/docker-images/bind9.tar', true) }}"
dns_server_allow_query: "{{ lookup('env', 'ANSIBLE_DNS_SERVER_ALLOW_QUERY') | default('[]', true) | from_yaml }}"
dns_server_forwarders: "{{ lookup('env', 'ANSIBLE_DNS_SERVER_FORWARDERS') | default('[]', true) | from_yaml }}"
dns_server_zone_serial: "{{ (lookup('env', 'ANSIBLE_DNS_SERVER_ZONE_SERIAL') | default('1', true)) | int }}"
dns_server_zones: "{{ lookup('env', 'ANSIBLE_DNS_SERVER_ZONES') | default('[]', true) | from_yaml }}"
time_server_enabled: "{{ (lookup('env', 'ANSIBLE_TIME_SERVER_ENABLED') | default('true', true)) | bool }}"
time_server_image: "{{ lookup('env', 'ANSIBLE_TIME_SERVER_IMAGE') | default('local/chrony:offline', true) }}"
time_server_image_tar: "{{ lookup('env', 'ANSIBLE_TIME_SERVER_IMAGE_TAR') | default('./repo/docker-images/chrony.tar', true) }}"
time_server_allow: "{{ lookup('env', 'ANSIBLE_TIME_SERVER_ALLOW') | default('[]', true) | from_yaml }}"
time_server_upstream_servers: "{{ lookup('env', 'ANSIBLE_TIME_SERVER_UPSTREAM_SERVERS') | default('[]', true) | from_yaml }}"
time_server_local_stratum: "{{ (lookup('env', 'ANSIBLE_TIME_SERVER_LOCAL_STRATUM') | default('10', true)) | int }}"

# NTP client role
ntp_client_enabled: "{{ (lookup('env', 'ANSIBLE_NTP_CLIENT_ENABLED') | default('false', true)) | bool }}"
ntp_client_target_group: "{{ lookup('env', 'ANSIBLE_NTP_CLIENT_TARGET_GROUP') | default('all_targets:!dns_time_servers', true) }}"
ntp_client_servers: "{{ lookup('env', 'ANSIBLE_NTP_CLIENT_SERVERS') | default('[]', true) | from_yaml }}"
ntp_client_fallback_servers: "{{ lookup('env', 'ANSIBLE_NTP_CLIENT_FALLBACK_SERVERS') | default('[]', true) | from_yaml }}"

# TLDH database role
tldh_database_enabled: "{{ (lookup('env', 'ANSIBLE_TLDH_DATABASE_ENABLED') | default('false', true)) | bool }}"
tldh_database_target_group: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_TARGET_GROUP') | default('tldh_database_targets', true) }}"
tldh_database_master_group: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_MASTER_GROUP') | default('tldh_database_masters', true) }}"
tldh_database_slave_group: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_SLAVE_GROUP') | default('tldh_database_slaves', true) }}"
tldh_database_base_dir: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_BASE_DIR') | default('/opt/tldh-data', true) }}"
tldh_database_config_dir: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_CONFIG_DIR') | default(tldh_database_base_dir ~ '/config', true) }}"
tldh_database_data_dir: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_DATA_DIR') | default('/mnt/data/mysql', true) }}"
tldh_database_image: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_IMAGE') | default('registry.bcy.gov.vn/tldh/mariadb:10.7', true) }}"
tldh_database_image_tar: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_IMAGE_TAR') | default('', true) }}"
tldh_database_load_image: "{{ (lookup('env', 'ANSIBLE_TLDH_DATABASE_LOAD_IMAGE') | default('false', true)) | bool }}"
tldh_database_root_password: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_ROOT_PASSWORD') | default('', true) }}"
tldh_database_app_user: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_APP_USER') | default('', true) }}"
tldh_database_app_password: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_APP_PASSWORD') | default('', true) }}"
tldh_database_root_host: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_ROOT_HOST') | default('%', true) }}"
tldh_database_replication_user: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_REPLICATION_USER') | default('replica', true) }}"
tldh_database_replication_password: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_REPLICATION_PASSWORD') | default('', true) }}"
tldh_database_master_host: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_MASTER_HOST') | default('', true) }}"
tldh_database_master_port: "{{ (lookup('env', 'ANSIBLE_TLDH_DATABASE_MASTER_PORT') | default('3306', true)) | int }}"
tldh_database_master_server_id: "{{ (lookup('env', 'ANSIBLE_TLDH_DATABASE_MASTER_SERVER_ID') | default('1', true)) | int }}"
tldh_database_slave_server_id: "{{ (lookup('env', 'ANSIBLE_TLDH_DATABASE_SLAVE_SERVER_ID') | default('2', true)) | int }}"

# External disk role
external_disk_enabled: "{{ (lookup('env', 'ANSIBLE_EXTERNAL_DISK_ENABLED') | default('false', true)) | bool }}"
external_disk_target_group: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_TARGET_GROUP') | default('external_disk_targets', true) }}"
external_disk_device: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_DEVICE') | default('/dev/sdb', true) }}"
external_disk_partition: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_PARTITION') | default(external_disk_device ~ '1', true) }}"
external_disk_mount_path: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_MOUNT_PATH') | default('/mnt/data', true) }}"
external_disk_fstype: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_FSTYPE') | default('ext4', true) }}"
external_disk_mount_opts: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_MOUNT_OPTS') | default('defaults', true) }}"
external_disk_create_partition: "{{ (lookup('env', 'ANSIBLE_EXTERNAL_DISK_CREATE_PARTITION') | default('true', true)) | bool }}"
external_disk_format: "{{ (lookup('env', 'ANSIBLE_EXTERNAL_DISK_FORMAT') | default('true', true)) | bool }}"

# Hostname role
hostname_manage: "{{ (lookup('env', 'ANSIBLE_HOSTNAME_MANAGE') | default('false', true)) | bool }}"
hostname_value: "{{ lookup('env', 'ANSIBLE_HOSTNAME_VALUE') | default('', true) }}"
hostname_domain: "{{ lookup('env', 'ANSIBLE_HOSTNAME_DOMAIN') | default('', true) }}"

# Network role
network_manage: "{{ (lookup('env', 'ANSIBLE_NETWORK_MANAGE') | default('false', true)) | bool }}"
network_interface: "{{ lookup('env', 'ANSIBLE_NETWORK_INTERFACE') | default('', true) }}"
network_ipv4_address: "{{ lookup('env', 'ANSIBLE_NETWORK_IPV4_ADDRESS') | default('', true) }}"
network_ipv4_prefix_length: "{{ (lookup('env', 'ANSIBLE_NETWORK_IPV4_PREFIX_LENGTH') | default('24', true)) | int }}"
network_ipv4_gateway: "{{ lookup('env', 'ANSIBLE_NETWORK_IPV4_GATEWAY') | default('', true) }}"
network_dns_servers: "{{ lookup('env', 'ANSIBLE_NETWORK_DNS_SERVERS') | default('[]', true) | from_yaml }}"

# Docker Swarm role
docker_swarm_enabled: "{{ (lookup('env', 'ANSIBLE_DOCKER_SWARM_ENABLED') | default('true', true)) | bool }}"
docker_swarm_manager_group: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_MANAGER_GROUP') | default('swarm_managers', true) }}"
docker_swarm_worker_group: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_WORKER_GROUP') | default('swarm_workers', true) }}"
docker_swarm_listen_addr: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_LISTEN_ADDR') | default('0.0.0.0:2377', true) }}"
docker_swarm_port: "{{ (lookup('env', 'ANSIBLE_DOCKER_SWARM_PORT') | default('2377', true)) | int }}"
docker_swarm_force_reset: "{{ (lookup('env', 'ANSIBLE_DOCKER_SWARM_FORCE_RESET') | default('false', true)) | bool }}"
docker_swarm_manager_addr: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_MANAGER_ADDR') | default('', true) }}"
docker_swarm_manage_iptables: "{{ (lookup('env', 'ANSIBLE_DOCKER_SWARM_MANAGE_IPTABLES') | default('false', true)) | bool }}"
docker_swarm_iptables_source_cidr: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_IPTABLES_SOURCE_CIDR') | default('0.0.0.0/0', true) }}"
docker_swarm_manage_encrypted_overlay_esp: "{{ (lookup('env', 'ANSIBLE_DOCKER_SWARM_MANAGE_ENCRYPTED_OVERLAY_ESP') | default('false', true)) | bool }}"
# Add published application ports here when needed.
# Example:
# docker_swarm_service_ports:
#   - port: 80
#     protocol: tcp
#   - port: 443
#     protocol: tcp
docker_swarm_service_ports: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_SERVICE_PORTS') | default('[]', true) | from_yaml }}"

# Label nodes automatically after they join the Swarm.
# Group labels apply to any inventory group listed here. Host-level
# docker_swarm_node_labels can override these values.
docker_swarm_group_labels: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_GROUP_LABELS') | default('{swarm_app_workers: {workload: app, disk: ssd}, swarm_data_workers: {workload: data, disk: hdd}}', true) | from_yaml }}"
docker_swarm_node_labels: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_NODE_LABELS') | default('{}', true) | from_yaml }}"
