---
- name: Remove existing Zabbix iptables traffic rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_zabbix_rule_delete
  changed_when: iptables_zabbix_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_zabbix_rules }}"
  tags:
    - iptables
    - iptables_zabbix

- name: Check Zabbix iptables traffic rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_zabbix_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_zabbix_rules }}"
  tags:
    - iptables
    - iptables_zabbix

- name: Allow Zabbix iptables traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_zabbix_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables
    - iptables_zabbix
