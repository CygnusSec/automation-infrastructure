---
- name: Normalize iptables SSH whitelist IPs
  ansible.builtin.set_fact:
    iptables_ssh_whitelist_ips: >-
      {{
        iptables_ssh_whitelist_ips_raw.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  tags:
    - iptables

- name: Validate iptables reset chains
  ansible.builtin.assert:
    that:
      - iptables_reset_chains is sequence
      - item in ['INPUT', 'OUTPUT']
    fail_msg: "iptables_reset_chains only supports INPUT and OUTPUT: {{ item }}"
  loop: "{{ iptables_reset_chains }}"
  when: iptables_reset_enabled | bool
  tags:
    - iptables

- name: Allow iptables INPUT and OUTPUT policies before reset
  ansible.builtin.command:
    argv:
      - iptables
      - -P
      - "{{ item }}"
      - ACCEPT
  changed_when: true
  loop: "{{ iptables_reset_chains | unique }}"
  when: iptables_reset_enabled | bool
  tags:
    - iptables

- name: Clear old iptables INPUT and OUTPUT rules before applying new rules
  ansible.builtin.command:
    argv:
      - iptables
      - -F
      - "{{ item }}"
  changed_when: true
  loop: "{{ iptables_reset_chains | unique }}"
  when: iptables_reset_enabled | bool
  tags:
    - iptables

- name: Validate common iptables inputs
  ansible.builtin.assert:
    that:
      - iptables_ssh_port | int >= 1
      - iptables_ssh_port | int <= 65535
      - iptables_ssh_whitelist_ips | length > 0
    fail_msg: >-
      Set ANSIBLE_IPTABLES_SSH_WHITELIST_IPS to a comma-separated list of IPv4
      addresses or CIDRs, and set ANSIBLE_IPTABLES_SSH_PORT to a valid TCP port.
  tags:
    - iptables

- name: Validate iptables SSH whitelist entries
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables SSH whitelist entry: {{ item }}"
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Validate iptables service source whitelist entries
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables service source whitelist entry: {{ item }}"
  loop: "{{ iptables_service_allowed_source_ips }}"
  tags:
    - iptables

- name: Validate iptables external service rule structure
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.ips is defined
      - item.ips is sequence
      - item.ips | length > 0
      - item.ports is defined
      - item.ports is sequence
      - item.ports | length > 0
      - item.protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: >-
      Invalid iptables external service rule. Expected
      {name, ips: [...], ports: [...], protocol: tcp|udp}.
  loop: "{{ iptables_external_service_rules }}"
  tags:
    - iptables

- name: Validate iptables external service rule IPs
  ansible.builtin.assert:
    that:
      - item.1 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables external service IP in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_external_service_rules | subelements('ips') }}"
  tags:
    - iptables

- name: Validate iptables external service rule ports
  ansible.builtin.assert:
    that:
      - item.1 | int >= 1
      - item.1 | int <= 65535
    fail_msg: "Invalid iptables external service port in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_external_service_rules | subelements('ports') }}"
  tags:
    - iptables

- name: Validate iptables per-IP port rule structure
  ansible.builtin.assert:
    that:
      - item.ip is defined
      - item.ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
      - item.ports is defined
      - item.ports is sequence
      - item.protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: >-
      Invalid iptables per-IP port rule. Expected
      {ip: <ipv4-or-cidr>, ports: [...], protocol: tcp|udp}.
  loop: "{{ iptables_ip_port_rules }}"
  tags:
    - iptables

- name: Validate iptables per-IP port rule ports
  ansible.builtin.assert:
    that:
      - item.1 | int >= 1
      - item.1 | int <= 65535
    fail_msg: "Invalid iptables per-IP port in {{ item.0.ip }}: {{ item.1 }}"
  loop: "{{ iptables_ip_port_rules | subelements('ports') }}"
  tags:
    - iptables

- name: Validate iptables Zabbix inputs
  ansible.builtin.assert:
    that:
      - iptables_zabbix_agent_port | int >= 1
      - iptables_zabbix_agent_port | int <= 65535
      - iptables_zabbix_server_port | int >= 1
      - iptables_zabbix_server_port | int <= 65535
    fail_msg: "Set valid Zabbix agent and server TCP ports."
  tags:
    - iptables

- name: Validate iptables Zabbix server IPs
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables Zabbix server IP entry: {{ item }}"
  loop: "{{ iptables_zabbix_server_ips }}"
  tags:
    - iptables

- name: Validate iptables DNS/time inputs
  ansible.builtin.assert:
    that:
      - iptables_dns_port | int >= 1
      - iptables_dns_port | int <= 65535
      - iptables_time_port | int >= 1
      - iptables_time_port | int <= 65535
    fail_msg: "Set valid DNS and time service ports."
  tags:
    - iptables

- name: Validate iptables DNS/time server IPs
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables DNS/time server IP entry: {{ item }}"
  loop: "{{ iptables_dns_time_server_ips }}"
  tags:
    - iptables

- name: Validate iptables DNS/time client source entries
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables DNS/time client source entry: {{ item }}"
  loop: "{{ iptables_dns_time_client_sources }}"
  tags:
    - iptables

- name: Build common iptables base rules
  ansible.builtin.set_fact:
    iptables_loopback_rules:
      - chain: INPUT
        args:
          - -i
          - lo
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -o
          - lo
          - -j
          - ACCEPT
    iptables_base_rules:
      - chain: INPUT
        args:
          - -i
          - lo
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -o
          - lo
          - -j
          - ACCEPT
      - chain: INPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED,RELATED
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED
          - -j
          - ACCEPT
  tags:
    - iptables

- name: Initialize iptables service rules
  ansible.builtin.set_fact:
    iptables_service_rules: []
  tags:
    - iptables

- name: Add iptables source rules for access to local services
  ansible.builtin.set_fact:
    iptables_service_rules: >-
      {{
        iptables_service_rules
        + [
          {'chain': 'INPUT', 'args': ['-s', item, '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-d', item, '-j', 'ACCEPT']}
        ]
      }}
  loop: "{{ iptables_service_allowed_source_ips }}"
  tags:
    - iptables

- name: Add iptables outbound rules to external services
  ansible.builtin.set_fact:
    iptables_service_rules: >-
      {{
        iptables_service_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item.ips | join(','),
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'INPUT',
            'args': [
              '-s', item.ips | join(','),
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--sports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_external_service_rules }}"
  tags:
    - iptables

- name: Initialize iptables Zabbix rules
  ansible.builtin.set_fact:
    iptables_zabbix_rules: []
  tags:
    - iptables

- name: Initialize iptables per-IP port rules
  ansible.builtin.set_fact:
    iptables_ip_port_allow_rules: []
  tags:
    - iptables

- name: Add iptables per-IP port allow rules
  ansible.builtin.set_fact:
    iptables_ip_port_allow_rules: >-
      {{
        iptables_ip_port_allow_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-s', item.ip,
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item.ip,
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--sports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item.ip,
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'INPUT',
            'args': [
              '-s', item.ip,
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--sports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_ip_port_rules }}"
  when: item.ports | length > 0
  tags:
    - iptables

- name: Add iptables Zabbix server rules
  ansible.builtin.set_fact:
    iptables_zabbix_rules: >-
      {{
        iptables_zabbix_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-s', item,
              '-p', 'tcp',
              '--dport', iptables_zabbix_agent_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item,
              '-p', 'tcp',
              '--sport', iptables_zabbix_agent_port | string,
              '-m', 'conntrack',
              '--ctstate', 'ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item,
              '-p', 'tcp',
              '--dport', iptables_zabbix_server_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'INPUT',
            'args': [
              '-s', item,
              '-p', 'tcp',
              '--sport', iptables_zabbix_server_port | string,
              '-m', 'conntrack',
              '--ctstate', 'ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_zabbix_server_ips }}"
  tags:
    - iptables

- name: Initialize iptables DNS/time rules
  ansible.builtin.set_fact:
    iptables_dns_time_rules: []
  tags:
    - iptables

- name: Add iptables rules for local DNS/time server access
  ansible.builtin.set_fact:
    iptables_dns_time_rules: >-
      {{
        iptables_dns_time_rules
        + [
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'tcp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'tcp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'udp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'udp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'udp', '--dport', iptables_time_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'udp', '--sport', iptables_time_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ iptables_dns_time_client_sources }}"
  tags:
    - iptables

- name: Add iptables client rules to DNS/time servers
  ansible.builtin.set_fact:
    iptables_dns_time_rules: >-
      {{
        iptables_dns_time_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'tcp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'tcp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'udp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'udp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-d', item, '-p', 'udp', '--dport', iptables_time_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-s', item, '-p', 'udp', '--sport', iptables_time_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ iptables_dns_time_server_ips }}"
  tags:
    - iptables

- name: Initialize iptables SSH priority rules
  ansible.builtin.set_fact:
    iptables_ssh_priority_rules: []
  tags:
    - iptables

- name: Add iptables SSH priority rules
  ansible.builtin.set_fact:
    iptables_ssh_priority_rules: >-
      {{
        iptables_ssh_priority_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-s', item,
              '-p', 'tcp',
              '--dport', iptables_ssh_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-d', item,
              '-p', 'tcp',
              '--sport', iptables_ssh_port | string,
              '-m', 'conntrack',
              '--ctstate', 'ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Build priority iptables rules for final ordering
  ansible.builtin.set_fact:
    iptables_priority_rules: "{{ iptables_loopback_rules + iptables_dns_time_rules + iptables_ssh_priority_rules }}"
  tags:
    - iptables

- name: Remove existing iptables per-IP port allow rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_ip_port_allow_rule_delete
  changed_when: iptables_ip_port_allow_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_ip_port_allow_rules }}"
  tags:
    - iptables

- name: Check iptables per-IP port allow rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_ip_port_allow_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_ip_port_allow_rules }}"
  tags:
    - iptables

- name: Allow iptables per-IP port traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_ip_port_allow_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing iptables DNS/time traffic rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_dns_time_rule_delete
  changed_when: iptables_dns_time_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_dns_time_rules }}"
  tags:
    - iptables

- name: Check iptables DNS/time traffic rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_dns_time_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_dns_time_rules }}"
  tags:
    - iptables

- name: Allow iptables DNS/time traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_dns_time_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing iptables Zabbix traffic rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_zabbix_rule_delete
  changed_when: iptables_zabbix_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_zabbix_rules }}"
  tags:
    - iptables

- name: Check iptables Zabbix traffic rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_zabbix_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_zabbix_rules }}"
  tags:
    - iptables

- name: Allow iptables Zabbix traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_zabbix_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing iptables service traffic rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_service_rule_delete
  changed_when: iptables_service_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_service_rules }}"
  tags:
    - iptables

- name: Check iptables service traffic rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_service_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_service_rules }}"
  tags:
    - iptables

- name: Allow iptables service traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_service_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing common iptables base rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: iptables_base_rule_delete
  changed_when: iptables_base_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_base_rules }}"
  tags:
    - iptables

- name: Check common iptables base rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: iptables_base_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_base_rules }}"
  tags:
    - iptables

- name: Allow common iptables base traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ iptables_base_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing iptables SSH input whitelist rules before reinserting
  ansible.builtin.command:
    argv:
      - iptables
      - -D
      - INPUT
      - -s
      - "{{ item }}"
      - -p
      - tcp
      - --dport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - NEW,ESTABLISHED
      - -j
      - ACCEPT
  register: iptables_ssh_input_rule_delete
  changed_when: iptables_ssh_input_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Check iptables SSH input whitelist rules
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - INPUT
      - -s
      - "{{ item }}"
      - -p
      - tcp
      - --dport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - NEW,ESTABLISHED
      - -j
      - ACCEPT
  register: iptables_ssh_input_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Allow iptables SSH input whitelist traffic
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - INPUT
      - -s
      - "{{ item.item }}"
      - -p
      - tcp
      - --dport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - NEW,ESTABLISHED
      - -j
      - ACCEPT
  changed_when: true
  loop: "{{ iptables_ssh_input_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove existing iptables SSH output whitelist rules before reinserting
  ansible.builtin.command:
    argv:
      - iptables
      - -D
      - OUTPUT
      - -d
      - "{{ item }}"
      - -p
      - tcp
      - --sport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - ESTABLISHED
      - -j
      - ACCEPT
  register: iptables_ssh_output_rule_delete
  changed_when: iptables_ssh_output_rule_delete.rc == 0
  failed_when: false
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Check iptables SSH output whitelist rules
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - OUTPUT
      - -d
      - "{{ item }}"
      - -p
      - tcp
      - --sport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - ESTABLISHED
      - -j
      - ACCEPT
  register: iptables_ssh_output_rule_check
  changed_when: false
  failed_when: false
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables

- name: Allow iptables SSH output whitelist traffic
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - OUTPUT
      - -d
      - "{{ item.item }}"
      - -p
      - tcp
      - --sport
      - "{{ iptables_ssh_port | string }}"
      - -m
      - conntrack
      - --ctstate
      - ESTABLISHED
      - -j
      - ACCEPT
  changed_when: true
  loop: "{{ iptables_ssh_output_rule_check.results }}"
  when: item.rc != 0
  tags:
    - iptables

- name: Remove priority iptables rules before final ordering
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  changed_when: false
  failed_when: false
  loop: "{{ iptables_priority_rules }}"
  tags:
    - iptables

- name: Reinsert priority iptables rules in fixed order
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.chain] + item.args }}"
  changed_when: true
  loop: "{{ iptables_priority_rules | reverse | list }}"
  tags:
    - iptables
