---
- name: Normalize iptables SSH whitelist IPs
  ansible.builtin.set_fact:
    iptables_ssh_whitelist_ips: >-
      {{
        iptables_ssh_whitelist_ips_raw.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Validate iptables reset chains
  ansible.builtin.assert:
    that:
      - iptables_reset_chains is sequence
      - item in ['INPUT', 'OUTPUT']
    fail_msg: "iptables_reset_chains only supports INPUT and OUTPUT: {{ item }}"
  loop: "{{ iptables_reset_chains }}"
  when: iptables_reset_enabled | bool
  tags:
    - iptables
    - iptables_primary

- name: Clear old iptables INPUT and OUTPUT rules before applying new rules
  ansible.builtin.command:
    argv:
      - iptables
      - -F
      - "{{ item }}"
  changed_when: true
  loop: "{{ iptables_reset_chains | unique }}"
  when: iptables_reset_enabled | bool
  tags:
    - iptables
    - iptables_primary

- name: Validate common iptables inputs
  ansible.builtin.assert:
    that:
      - iptables_ssh_port | int >= 1
      - iptables_ssh_port | int <= 65535
      - iptables_ssh_whitelist_ips | length > 0
    fail_msg: >-
      Set ANSIBLE_IPTABLES_SSH_WHITELIST_IPS to a comma-separated list of IPv4
      addresses or CIDRs, and set ANSIBLE_IPTABLES_SSH_PORT to a valid TCP port.
  tags:
    - iptables
    - iptables_primary

- name: Validate iptables SSH whitelist entries
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables SSH whitelist entry: {{ item }}"
  loop: "{{ iptables_ssh_whitelist_ips }}"
  tags:
    - iptables
    - iptables_primary

- name: Check ipset command when ipset management is enabled
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v ipset
  register: iptables_ipset_command_check
  changed_when: false
  failed_when: false
  when: iptables_manage_ipsets | bool
  tags:
    - iptables
    - iptables_primary
    - iptables_ipsets
    - iptables_zabbix

- name: Validate ipset command when ipset management is enabled
  ansible.builtin.assert:
    that:
      - iptables_ipset_command_check.rc == 0
    fail_msg: >-
      ipset is not installed on this host. Run
      ./scripts/run-ansible.sh deploy --tags prerequisite first, or install
      ipset and ipset-persistent before running iptables/iptable_primary.
  when: iptables_manage_ipsets | bool
  tags:
    - iptables
    - iptables_primary
    - iptables_ipsets
    - iptables_zabbix

- name: Validate legacy iptables service source whitelist is disabled
  ansible.builtin.assert:
    that:
      - iptables_service_allowed_source_ips | length == 0
    fail_msg: >-
      ANSIBLE_IPTABLES_SERVICE_ALLOWED_SOURCE_IPS creates broad host-level
      access and is disabled for INPUT/OUTPUT DROP mode. Use
      ANSIBLE_IPTABLES_INBOUND_SERVICE_RULES, ANSIBLE_IPTABLES_EXTERNAL_SERVICE_RULES,
      or ANSIBLE_IPTABLES_IP_PORT_RULES with explicit ports instead.
  tags:
    - iptables
    - iptables_primary

- name: Validate iptables external service rule structure
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.ips is defined
      - item.ips is sequence
      - item.ips | length > 0
      - item.ports is defined
      - item.ports is sequence
      - item.ports | length > 0
      - item.protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: >-
      Invalid iptables external service rule. Expected
      {name, ips: [...], ports: [...], protocol: tcp|udp, source_ips: [...] optional}.
  loop: "{{ iptables_external_service_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Validate iptables external service rule IPs
  ansible.builtin.assert:
    that:
      - item.1 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables external service IP in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_external_service_rules | subelements('ips') }}"
  tags:
    - iptables
    - iptables_primary

- name: Validate iptables external service rule source IPs
  ansible.builtin.assert:
    that:
      - item.1 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables external service source IP in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_external_service_rules | selectattr('source_ips', 'defined') | list | subelements('source_ips') }}"
  tags:
    - iptables
    - iptables_primary

- name: Validate iptables external service rule ports
  ansible.builtin.assert:
    that:
      - item.1 | int >= 1
      - item.1 | int <= 65535
    fail_msg: "Invalid iptables external service port in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_external_service_rules | subelements('ports') }}"
  tags:
    - iptables

- name: Validate iptables inbound service rule structure
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.target_ips is defined
      - item.target_ips is sequence
      - item.target_ips | length > 0
      - item.source_ips is defined
      - item.source_ips is sequence
      - item.source_ips | length > 0
      - item.ports is defined
      - item.ports is sequence
      - item.ports | length > 0
      - item.protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: >-
      Invalid iptables inbound service rule. Expected
      {name, target_ips: [...], source_ips: [...], ports: [...], protocol: tcp|udp}.
  loop: "{{ iptables_inbound_service_rules }}"
  tags:
    - iptables

- name: Validate iptables inbound service target IPs
  ansible.builtin.assert:
    that:
      - item.1 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables inbound service target IP in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_inbound_service_rules | subelements('target_ips') }}"
  tags:
    - iptables

- name: Validate iptables inbound service source IPs
  ansible.builtin.assert:
    that:
      - item.1 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables inbound service source IP in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_inbound_service_rules | subelements('source_ips') }}"
  tags:
    - iptables

- name: Validate iptables inbound service ports
  ansible.builtin.assert:
    that:
      - item.1 | int >= 1
      - item.1 | int <= 65535
    fail_msg: "Invalid iptables inbound service port in {{ item.0.name }}: {{ item.1 }}"
  loop: "{{ iptables_inbound_service_rules | subelements('ports') }}"
  tags:
    - iptables

- name: Validate iptables per-IP port rule structure
  ansible.builtin.assert:
    that:
      - item.ip is defined
      - item.ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
      - item.ports is defined
      - item.ports is sequence
      - item.protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: >-
      Invalid iptables per-IP port rule. Expected
      {ip: <ipv4-or-cidr>, ports: [...], protocol: tcp|udp}.
  loop: "{{ iptables_ip_port_rules }}"
  tags:
    - iptables

- name: Validate iptables per-IP port rule ports
  ansible.builtin.assert:
    that:
      - item.1 | int >= 1
      - item.1 | int <= 65535
    fail_msg: "Invalid iptables per-IP port in {{ item.0.ip }}: {{ item.1 }}"
  loop: "{{ iptables_ip_port_rules | subelements('ports') }}"
  tags:
    - iptables

- name: Validate iptables Zabbix inputs
  ansible.builtin.assert:
    that:
      - iptables_zabbix_agent_port | int >= 1
      - iptables_zabbix_agent_port | int <= 65535
      - iptables_zabbix_server_port | int >= 1
      - iptables_zabbix_server_port | int <= 65535
    fail_msg: "Set valid Zabbix agent and server TCP ports."
  tags:
    - iptables
    - iptables_zabbix

- name: Validate iptables Zabbix server IPs
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables Zabbix server IP entry: {{ item }}"
  loop: "{{ iptables_zabbix_server_ips }}"
  tags:
    - iptables
    - iptables_zabbix

- name: Validate iptables DNS/time inputs
  ansible.builtin.assert:
    that:
      - iptables_dns_port | int >= 1
      - iptables_dns_port | int <= 65535
      - iptables_time_port | int >= 1
      - iptables_time_port | int <= 65535
    fail_msg: "Set valid DNS and time service ports."
  tags:
    - iptables

- name: Validate iptables DNS/time server IPs
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables DNS/time server IP entry: {{ item }}"
  loop: "{{ iptables_dns_time_server_ips }}"
  tags:
    - iptables

- name: Validate iptables DNS/time client source entries
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$')
    fail_msg: "Invalid iptables DNS/time client source entry: {{ item }}"
  loop: "{{ iptables_dns_time_client_sources }}"
  tags:
    - iptables

- name: Build common iptables base rules
  ansible.builtin.set_fact:
    iptables_loopback_rules:
      - chain: INPUT
        args:
          - -i
          - lo
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -o
          - lo
          - -j
          - ACCEPT
    iptables_established_rules:
      - chain: INPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED,RELATED
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED,RELATED
          - -j
          - ACCEPT
    iptables_base_rules:
      - chain: INPUT
        args:
          - -i
          - lo
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -o
          - lo
          - -j
          - ACCEPT
      - chain: INPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED,RELATED
          - -j
          - ACCEPT
      - chain: OUTPUT
        args:
          - -m
          - conntrack
          - --ctstate
          - ESTABLISHED,RELATED
          - -j
          - ACCEPT
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Initialize iptables service rules
  ansible.builtin.set_fact:
    iptables_service_rules: []
    iptables_inbound_service_allow_rules: []
    iptables_external_service_ipset_rules: []
    iptables_inbound_service_ipset_rules: []
    iptables_per_ip_port_ipset_rules: []
    iptables_managed_ipsets: []
    iptables_managed_ipset_entries: []
    iptables_local_ip: "{{ ansible_host | default(inventory_hostname) }}"
    iptables_target_ips: []
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Resolve iptables target IPs from target group
  ansible.builtin.set_fact:
    iptables_target_ips: >-
      {{
        (iptables_target_ips | default([]))
        + [
          hostvars[item].ansible_host | default(item)
        ]
      }}
  loop: "{{ groups[iptables_target_group] | default([]) }}"
  tags:
    - iptables
    - iptables_primary

- name: Build iptables external service ipset rules
  ansible.builtin.set_fact:
    iptables_external_service_ipset_rules: >-
      {{
        iptables_external_service_ipset_rules
        + [
          item | combine({
            'ipset_name': ((iptables_ipset_prefix ~ '_' ~ item.name) | regex_replace('[^A-Za-z0-9_:-]', '_')),
            'client_ips': (
              item.source_ips | default([])
              if (item.source_ips is defined and item.source_ips | length > 0)
              else (iptables_target_ips | reject('equalto', iptables_local_ip) | list)
            )
          })
        ]
      }}
  loop: "{{ iptables_external_service_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Build iptables inbound service ipset rules for this host
  ansible.builtin.set_fact:
    iptables_inbound_service_ipset_rules: >-
      {{
        iptables_inbound_service_ipset_rules
        + [
          item | combine({
            'ipset_name': ((iptables_ipset_prefix ~ '_in_' ~ item.name) | regex_replace('[^A-Za-z0-9_:-]', '_'))
          })
        ]
      }}
  loop: "{{ iptables_inbound_service_rules }}"
  when: iptables_local_ip in item.target_ips
  tags:
    - iptables
    - iptables_primary

- name: Build iptables per-IP port ipset rules
  ansible.builtin.set_fact:
    iptables_per_ip_port_ipset_rules: >-
      {{
        iptables_per_ip_port_ipset_rules
        + [
          item | combine({
            'ipset_name': ((iptables_ipset_prefix ~ '_ip_' ~ (item.ip | regex_replace('[^A-Za-z0-9_:-]', '_'))) | regex_replace('[^A-Za-z0-9_:-]', '_'))
          })
        ]
      }}
  loop: "{{ iptables_ip_port_rules }}"
  when: item.ports | length > 0
  tags:
    - iptables
    - iptables_primary

- name: Add iptables outbound rules to external services
  ansible.builtin.set_fact:
    iptables_service_rules: >-
      {{
        iptables_service_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'dst',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_external_service_ipset_rules }}"
  when:
    - iptables_local_ip not in item.ips
    - item.source_ips is not defined or item.source_ips | length == 0 or iptables_local_ip in item.source_ips
  tags:
    - iptables
    - iptables_primary

- name: Add iptables local external service server rules
  ansible.builtin.set_fact:
    iptables_service_rules: >-
      {{
        iptables_service_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'src',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'dst',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--sports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_external_service_ipset_rules }}"
  when: iptables_local_ip in item.ips
  tags:
    - iptables
    - iptables_primary

- name: Add iptables inbound service access rules
  ansible.builtin.set_fact:
    iptables_inbound_service_allow_rules: >-
      {{
        iptables_inbound_service_allow_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'src',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ iptables_inbound_service_ipset_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Initialize iptables Zabbix rules
  ansible.builtin.set_fact:
    iptables_zabbix_rules: []
    iptables_ssh_remote_whitelist_ips: >-
      {{
        iptables_ssh_whitelist_ips
        | reject('equalto', ansible_host | default(inventory_hostname))
        | list
      }}
    iptables_ssh_target_ips: >-
      {{
        iptables_target_ips
        | reject('equalto', iptables_local_ip)
        | list
      }}
    iptables_zabbix_agent_ips: []
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Resolve iptables Zabbix agent IPs from target group
  ansible.builtin.set_fact:
    iptables_zabbix_agent_ips: >-
      {{
        (iptables_zabbix_agent_ips | default([]))
        + [
          hostvars[item].ansible_host | default(item)
        ]
      }}
  loop: "{{ groups[iptables_target_group] | default([]) }}"
  when: (hostvars[item].ansible_host | default(item)) not in iptables_zabbix_server_ips
  tags:
    - iptables
    - iptables_zabbix

- name: Initialize iptables per-IP port rules
  ansible.builtin.set_fact:
    iptables_ip_port_allow_rules: []
  tags:
    - iptables
    - iptables_primary

- name: Add iptables per-IP port allow rules
  ansible.builtin.set_fact:
    iptables_ip_port_allow_rules: >-
      {{
        iptables_ip_port_allow_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'src',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', item.ipset_name,
              'dst',
              '-p', item.protocol | default('tcp'),
              '-m', 'multiport',
              '--dports', item.ports | map('string') | join(','),
              '-j', 'ACCEPT'
            ]
          },
        ]
      }}
  loop: "{{ iptables_per_ip_port_ipset_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Add iptables Zabbix agent rules
  ansible.builtin.set_fact:
    iptables_zabbix_rules: >-
      {{
        iptables_zabbix_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-m', 'set',
              '--match-set', iptables_ipset_zabbix_servers_name,
              'src',
              '-p', 'tcp',
              '--dport', iptables_zabbix_agent_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', iptables_ipset_zabbix_servers_name,
              'dst',
              '-p', 'tcp',
              '--dport', iptables_zabbix_server_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          }
        ]
      }}
  loop: "{{ [iptables_ipset_zabbix_servers_name] }}"
  when: iptables_local_ip not in iptables_zabbix_server_ips
  tags:
    - iptables
    - iptables_zabbix

- name: Add iptables Zabbix server polling rules
  ansible.builtin.set_fact:
    iptables_zabbix_rules: >-
      {{
        iptables_zabbix_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', iptables_ipset_zabbix_agents_name,
              'dst',
              '-p', 'tcp',
              '--dport', iptables_zabbix_agent_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
        ]
      }}
  loop: "{{ [iptables_ipset_zabbix_agents_name] }}"
  when: iptables_local_ip in iptables_zabbix_server_ips
  tags:
    - iptables
    - iptables_zabbix

- name: Initialize iptables DNS/time rules
  ansible.builtin.set_fact:
    iptables_dns_time_rules: []
    iptables_dns_time_effective_client_sources: >-
      {{
        (
          iptables_dns_time_client_sources
          if (iptables_dns_time_client_sources | length > 0)
          else (iptables_target_ips | reject('equalto', iptables_local_ip) | list)
        )
        | unique
      }}
  tags:
    - iptables
    - iptables_primary

- name: Add iptables rules for local DNS/time server access
  ansible.builtin.set_fact:
    iptables_dns_time_rules: >-
      {{
        iptables_dns_time_rules
        + [
          {
            'chain': 'INPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'src', '-p', 'tcp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'src', '-p', 'udp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'INPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'src', '-p', 'udp', '--dport', iptables_time_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'dst', '-p', 'tcp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'dst', '-p', 'udp', '--sport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_clients_name, 'dst', '-p', 'udp', '--sport', iptables_time_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ [iptables_ipset_dns_time_clients_name] }}"
  when:
    - iptables_local_ip in iptables_dns_time_server_ips
    - iptables_dns_time_effective_client_sources | length > 0
  tags:
    - iptables
    - iptables_primary

- name: Add iptables client rules to DNS/time servers
  ansible.builtin.set_fact:
    iptables_dns_time_rules: >-
      {{
        iptables_dns_time_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_servers_name, 'dst', '-p', 'tcp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_servers_name, 'dst', '-p', 'udp', '--dport', iptables_dns_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-m', 'set', '--match-set', iptables_ipset_dns_time_servers_name, 'dst', '-p', 'udp', '--dport', iptables_time_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ [iptables_ipset_dns_time_servers_name] }}"
  when: iptables_local_ip not in iptables_dns_time_server_ips
  tags:
    - iptables
    - iptables_primary

- name: Initialize iptables SSH priority rules
  ansible.builtin.set_fact:
    iptables_ssh_priority_rules: []
  tags:
    - iptables
    - iptables_primary

- name: Add iptables SSH priority rules
  ansible.builtin.set_fact:
    iptables_ssh_priority_rules: >-
      {{
        iptables_ssh_priority_rules
        + [
          {
            'chain': 'INPUT',
            'args': [
              '-m', 'set',
              '--match-set', iptables_ipset_ssh_sources_name,
              'src',
              '-p', 'tcp',
              '--dport', iptables_ssh_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
        ]
      }}
  loop: "{{ [iptables_ipset_ssh_sources_name] }}"
  tags:
    - iptables
    - iptables_primary

- name: Add iptables SSH outbound priority rules from whitelist hosts
  ansible.builtin.set_fact:
    iptables_ssh_priority_rules: >-
      {{
        iptables_ssh_priority_rules
        + [
          {
            'chain': 'OUTPUT',
            'args': [
              '-m', 'set',
              '--match-set', iptables_ipset_ssh_targets_name,
              'dst',
              '-p', 'tcp',
              '--dport', iptables_ssh_port | string,
              '-m', 'conntrack',
              '--ctstate', 'NEW,ESTABLISHED',
              '-j', 'ACCEPT'
            ]
          },
        ]
      }}
  when:
    - iptables_local_ip in iptables_ssh_whitelist_ips
    - iptables_ssh_target_ips | length > 0
  tags:
    - iptables
    - iptables_primary

- name: Build common iptables managed ipset definitions
  ansible.builtin.set_fact:
    iptables_managed_ipsets: >-
      {{
        (
          [
            iptables_ipset_ssh_sources_name,
          ]
          + ([iptables_ipset_ssh_targets_name] if (iptables_local_ip in iptables_ssh_whitelist_ips and iptables_ssh_target_ips | length > 0) else [])
          + ([iptables_ipset_dns_time_servers_name] if (iptables_local_ip not in iptables_dns_time_server_ips) else [])
          + ([iptables_ipset_dns_time_clients_name] if (iptables_local_ip in iptables_dns_time_server_ips and iptables_dns_time_effective_client_sources | length > 0) else [])
          + ([iptables_ipset_zabbix_servers_name] if (iptables_local_ip not in iptables_zabbix_server_ips) else [])
          + ([iptables_ipset_zabbix_agents_name] if (iptables_local_ip in iptables_zabbix_server_ips) else [])
          + (iptables_external_service_ipset_rules | map(attribute='ipset_name') | list)
          + (iptables_inbound_service_ipset_rules | map(attribute='ipset_name') | list)
          + (iptables_per_ip_port_ipset_rules | map(attribute='ipset_name') | list)
        )
        | unique
      }}
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables SSH source ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_ssh_sources_name, 'ip': item}] }}"
  loop: "{{ iptables_ssh_remote_whitelist_ips | unique }}"
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables SSH target ipset entries for whitelist hosts
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_ssh_targets_name, 'ip': item}] }}"
  loop: "{{ iptables_ssh_target_ips | unique }}"
  when: iptables_local_ip in iptables_ssh_whitelist_ips
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables DNS/time server ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_dns_time_servers_name, 'ip': item}] }}"
  loop: "{{ iptables_dns_time_server_ips | unique }}"
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables DNS/time client ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_dns_time_clients_name, 'ip': item}] }}"
  loop: "{{ iptables_dns_time_effective_client_sources | unique }}"
  when: iptables_local_ip in iptables_dns_time_server_ips
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables Zabbix server ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_zabbix_servers_name, 'ip': item}] }}"
  loop: "{{ iptables_zabbix_server_ips | unique }}"
  when: iptables_local_ip not in iptables_zabbix_server_ips
  tags:
    - iptables
    - iptables_zabbix

- name: Add common iptables Zabbix agent ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': iptables_ipset_zabbix_agents_name, 'ip': item}] }}"
  loop: "{{ iptables_zabbix_agent_ips | unique }}"
  when: iptables_local_ip in iptables_zabbix_server_ips
  tags:
    - iptables
    - iptables_zabbix

- name: Add common iptables external service ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': item.0.ipset_name, 'ip': item.1}] }}"
  loop: "{{ iptables_external_service_ipset_rules | subelements('ips') }}"
  when: iptables_local_ip not in item.0.ips
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables local external service client ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': item.0.ipset_name, 'ip': item.1}] }}"
  loop: "{{ iptables_external_service_ipset_rules | subelements('client_ips') }}"
  when: iptables_local_ip in item.0.ips
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables inbound service ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': item.0.ipset_name, 'ip': item.1}] }}"
  loop: "{{ iptables_inbound_service_ipset_rules | subelements('source_ips') }}"
  tags:
    - iptables
    - iptables_primary

- name: Add common iptables per-IP port ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries + [{'set_name': item.ipset_name, 'ip': item.ip}] }}"
  loop: "{{ iptables_per_ip_port_ipset_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Deduplicate common iptables managed ipset entries
  ansible.builtin.set_fact:
    iptables_managed_ipset_entries: "{{ iptables_managed_ipset_entries | unique }}"
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Ensure common iptables ipsets exist for all managed entries
  ansible.builtin.set_fact:
    iptables_managed_ipsets: >-
      {{
        (
          iptables_managed_ipsets
          + (iptables_managed_ipset_entries | map(attribute='set_name') | list)
        )
        | unique
      }}
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix

- name: Apply common iptables ipsets
  ansible.builtin.include_tasks: ipsets.yml
  when: iptables_manage_ipsets | bool
  tags:
    - iptables
    - iptables_primary
    - iptables_zabbix
    - iptables_ipsets

- name: Build primary iptables allow rules
  ansible.builtin.set_fact:
    iptables_primary_rules: >-
      {{
        iptables_ip_port_allow_rules
        + iptables_dns_time_rules
        + iptables_inbound_service_allow_rules
        + iptables_service_rules
        + iptables_base_rules
        + iptables_ssh_priority_rules
      }}
    iptables_priority_rules: "{{ iptables_loopback_rules + iptables_established_rules + iptables_dns_time_rules + iptables_ssh_priority_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Allow primary iptables traffic
  ansible.builtin.include_tasks: allow_primary.yml
  tags:
    - iptables
    - iptables_primary

- name: Allow Zabbix iptables traffic
  ansible.builtin.include_tasks: allow_zabbix.yml
  tags:
    - iptables
    - iptables_zabbix

- name: Remove priority iptables rules before final ordering
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  changed_when: false
  failed_when: false
  loop: "{{ iptables_priority_rules }}"
  tags:
    - iptables
    - iptables_primary

- name: Reinsert priority iptables rules in fixed order
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.chain] + item.args }}"
  changed_when: true
  loop: "{{ iptables_priority_rules | reverse | list }}"
  tags:
    - iptables
    - iptables_primary
