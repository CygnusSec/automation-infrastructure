---
- name: Build Docker Swarm iptables host lists
  ansible.builtin.set_fact:
    docker_swarm_iptables_node_hosts: >-
      {{
        (
          (groups[docker_swarm_manager_group] | default([]))
          + (groups[docker_swarm_worker_group] | default([]))
        ) | unique
      }}
    docker_swarm_iptables_manager_hosts: "{{ groups[docker_swarm_manager_group] | default([]) }}"
    docker_swarm_iptables_local_ip: "{{ docker_swarm_advertise_addr | default(ansible_host | default(inventory_hostname)) }}"
    docker_swarm_iptables_node_ips: []
    docker_swarm_iptables_manager_ips: []
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Resolve Docker Swarm iptables node IPs
  ansible.builtin.set_fact:
    docker_swarm_iptables_node_ips: >-
      {{
        (docker_swarm_iptables_node_ips | default([]))
        + [
          hostvars[item].docker_swarm_advertise_addr
          | default(hostvars[item].ansible_host | default(item))
        ]
      }}
  loop: "{{ docker_swarm_iptables_node_hosts }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Resolve Docker Swarm iptables manager IPs
  ansible.builtin.set_fact:
    docker_swarm_iptables_manager_ips: >-
      {{
        (docker_swarm_iptables_manager_ips | default([]))
        + [
          hostvars[item].docker_swarm_advertise_addr
          | default(hostvars[item].ansible_host | default(item))
        ]
      }}
  loop: "{{ docker_swarm_iptables_manager_hosts }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Initialize Docker Swarm iptables rules
  ansible.builtin.set_fact:
    docker_swarm_iptables_rules: []
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Add Docker Swarm manager join client rules
  ansible.builtin.set_fact:
    docker_swarm_iptables_rules: >-
      {{
        docker_swarm_iptables_rules
        + [
          {
            'chain': 'INPUT',
            'args': ['-p', 'tcp', '-s', item, '--sport', docker_swarm_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-p', 'tcp', '-d', item, '--dport', docker_swarm_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ docker_swarm_iptables_manager_ips | default([]) | unique }}"
  when: item != docker_swarm_iptables_local_ip
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Add Docker Swarm manager join server rules
  ansible.builtin.set_fact:
    docker_swarm_iptables_rules: >-
      {{
        docker_swarm_iptables_rules
        + [
          {
            'chain': 'INPUT',
            'args': ['-p', 'tcp', '-s', item, '--dport', docker_swarm_port | string, '-j', 'ACCEPT']
          },
          {
            'chain': 'OUTPUT',
            'args': ['-p', 'tcp', '-d', item, '--sport', docker_swarm_port | string, '-j', 'ACCEPT']
          }
        ]
      }}
  loop: "{{ docker_swarm_iptables_node_ips | default([]) | unique }}"
  when:
    - docker_swarm_iptables_local_ip in (docker_swarm_iptables_manager_ips | default([]))
    - item != docker_swarm_iptables_local_ip
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Add Docker Swarm peer discovery and overlay rules
  ansible.builtin.set_fact:
    docker_swarm_iptables_rules: >-
      {{
        docker_swarm_iptables_rules
        + [
          {'chain': 'INPUT', 'args': ['-p', 'tcp', '-s', item, '--dport', '7946', '-j', 'ACCEPT']},
          {'chain': 'INPUT', 'args': ['-p', 'udp', '-s', item, '--dport', '7946', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'tcp', '-d', item, '--sport', '7946', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'udp', '-d', item, '--sport', '7946', '-j', 'ACCEPT']},
          {'chain': 'INPUT', 'args': ['-p', 'tcp', '-s', item, '--sport', '7946', '-j', 'ACCEPT']},
          {'chain': 'INPUT', 'args': ['-p', 'udp', '-s', item, '--sport', '7946', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'tcp', '-d', item, '--dport', '7946', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'udp', '-d', item, '--dport', '7946', '-j', 'ACCEPT']},
          {'chain': 'INPUT', 'args': ['-p', 'udp', '-s', item, '--dport', '4789', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'udp', '-d', item, '--sport', '4789', '-j', 'ACCEPT']},
          {'chain': 'INPUT', 'args': ['-p', 'udp', '-s', item, '--sport', '4789', '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'udp', '-d', item, '--dport', '4789', '-j', 'ACCEPT']}
        ]
      }}
  loop: "{{ docker_swarm_iptables_node_ips | default([]) | unique }}"
  when: item != docker_swarm_iptables_local_ip
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Add Docker Swarm encrypted overlay ESP rules
  ansible.builtin.set_fact:
    docker_swarm_iptables_rules: >-
      {{
        docker_swarm_iptables_rules
        + [
          {'chain': 'INPUT', 'args': ['-p', 'esp', '-s', item, '-j', 'ACCEPT']},
          {'chain': 'OUTPUT', 'args': ['-p', 'esp', '-d', item, '-j', 'ACCEPT']}
        ]
      }}
  loop: "{{ docker_swarm_iptables_node_ips | default([]) | unique }}"
  when:
    - docker_swarm_manage_encrypted_overlay_esp | bool
    - item != docker_swarm_iptables_local_ip
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Check Docker Swarm iptables rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: docker_swarm_iptables_check
  changed_when: false
  failed_when: false
  loop: "{{ docker_swarm_iptables_rules }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables

- name: Allow Docker Swarm iptables traffic
  ansible.builtin.command:
    argv: "{{ ['iptables', '-A', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ docker_swarm_iptables_check.results }}"
  when: item.rc != 0
  tags:
    - docker_swarm
    - docker_swarm_iptables
