---
- name: Remove Docker Swarm DOCKER-USER return rule before drop
  ansible.builtin.shell: |
    while iptables -C DOCKER-USER -j RETURN 2>/dev/null; do
      iptables -D DOCKER-USER -j RETURN
    done
  args:
    executable: /bin/bash
  register: docker_swarm_iptables_docker_user_return_delete
  changed_when: false
  when: docker_swarm_docker_user_drop_enabled | bool
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_docker_user_drop

- name: Remove existing Docker Swarm DOCKER-USER drop rule before final ordering
  ansible.builtin.command:
    argv:
      - iptables
      - -D
      - DOCKER-USER
      - -j
      - DROP
  register: docker_swarm_iptables_docker_user_drop_delete
  changed_when: docker_swarm_iptables_docker_user_drop_delete.rc == 0
  failed_when: false
  when: docker_swarm_docker_user_drop_enabled | bool
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_docker_user_drop

- name: Check Docker Swarm DOCKER-USER drop rule
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - DOCKER-USER
      - -j
      - DROP
  register: docker_swarm_iptables_docker_user_drop_check
  changed_when: false
  failed_when: false
  when: docker_swarm_docker_user_drop_enabled | bool
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_docker_user_drop

- name: Drop unmatched Docker Swarm DOCKER-USER traffic
  ansible.builtin.command:
    argv:
      - iptables
      - -A
      - DOCKER-USER
      - -j
      - DROP
  changed_when: true
  when:
    - docker_swarm_docker_user_drop_enabled | bool
    - docker_swarm_iptables_docker_user_drop_check.rc != 0
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_docker_user_drop
