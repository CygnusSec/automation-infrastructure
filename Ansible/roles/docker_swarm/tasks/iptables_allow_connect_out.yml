---
- name: Remove stale Docker Swarm allow connect out DOCKER-USER rules
  ansible.builtin.shell: |
    changed=0
    bridge={{ docker_swarm_service_bridge_interface | quote }}
    host_interface={{ docker_swarm_service_host_interface | quote }}
    managed_sets_raw={{ (docker_swarm_docker_user_out_ipsets | default([]) | join(' ')) | quote }}
    read -r -a managed_sets <<< "${managed_sets_raw}"

    if [[ ${#managed_sets[@]} -gt 0 ]]; then
      while IFS= read -r rule; do
        [[ "${rule}" == -A\ DOCKER-USER* ]] || continue
        [[ "${rule}" == *" -i ${bridge} "* ]] || continue
        [[ "${rule}" == *" -j ACCEPT"* ]] || continue
        [[ "${rule}" != *" -o ${host_interface} "* ]] || continue

        managed=0
        for set_name in "${managed_sets[@]}"; do
          if [[ "${rule}" == *"--match-set ${set_name} "* ]]; then
            managed=1
            break
          fi
        done
        [[ "${managed}" -eq 1 ]] || continue

        delete_rule="${rule/#-A DOCKER-USER/-D DOCKER-USER}"
        while iptables ${delete_rule} 2>/dev/null; do
          changed=1
        done
      done < <(iptables -S DOCKER-USER)
    fi

    if [[ "${changed}" -eq 1 ]]; then
      echo changed
    fi
  args:
    executable: /bin/bash
  register: docker_swarm_iptables_stale_allow_connect_out_delete
  changed_when: "'changed' in docker_swarm_iptables_stale_allow_connect_out_delete.stdout"
  failed_when: false
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_allow_connect_out

- name: Remove existing Docker Swarm allow connect out DOCKER-USER rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: docker_swarm_iptables_allow_connect_out_delete
  changed_when: docker_swarm_iptables_allow_connect_out_delete.rc == 0
  failed_when: false
  loop: "{{ docker_swarm_allow_connect_out_rules }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_allow_connect_out

- name: Check Docker Swarm allow connect out DOCKER-USER rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: docker_swarm_iptables_allow_connect_out_check
  changed_when: false
  failed_when: false
  loop: "{{ docker_swarm_allow_connect_out_rules }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_allow_connect_out

- name: Allow outbound access from Swarm services
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain, '1'] + item.item.args }}"
  changed_when: true
  loop: "{{ docker_swarm_iptables_allow_connect_out_check.results }}"
  when: item.rc != 0
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_allow_connect_out
