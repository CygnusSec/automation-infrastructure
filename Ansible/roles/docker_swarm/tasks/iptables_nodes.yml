---
- name: Remove existing Docker Swarm node communication rules before reinserting
  ansible.builtin.command:
    argv: "{{ ['iptables', '-D', item.chain] + item.args }}"
  register: docker_swarm_iptables_nodes_delete
  changed_when: docker_swarm_iptables_nodes_delete.rc == 0
  failed_when: false
  loop: "{{ docker_swarm_iptables_rules }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_nodes

- name: Check Docker Swarm node communication rules
  ansible.builtin.command:
    argv: "{{ ['iptables', '-C', item.chain] + item.args }}"
  register: docker_swarm_iptables_nodes_check
  changed_when: false
  failed_when: false
  loop: "{{ docker_swarm_iptables_rules }}"
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_nodes

- name: Allow Docker Swarm nodes to communicate
  ansible.builtin.command:
    argv: "{{ ['iptables', '-I', item.item.chain] + item.item.args }}"
  changed_when: true
  loop: "{{ docker_swarm_iptables_nodes_check.results }}"
  when: item.rc != 0
  tags:
    - docker_swarm
    - docker_swarm_iptables
    - docker_swarm_iptables_nodes
