---
- name: Validate package update definitions
  ansible.builtin.assert:
    that:
      - package_update_packages is sequence
      - item.name is defined
      - item.name | length > 0
      - item.version is not defined or item.version | string | length > 0
    fail_msg: "Invalid package update entry. Expected {name} or {name, version}: {{ item }}"
  loop: "{{ package_update_packages }}"
  tags:
    - package_update

- name: Update apt cache for package updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ package_update_cache_valid_time }}"
  when: not package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Build apt package specs
  ansible.builtin.set_fact:
    package_update_apt_package_specs: >-
      {{
        (package_update_apt_package_specs | default([]))
        + [
          item.name ~ '=' ~ item.version
          if item.version is defined and item.version | string | length > 0
          else item.name
        ]
      }}
  loop: "{{ package_update_packages }}"
  when: not package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Install package updates from apt repositories
  ansible.builtin.apt:
    name: "{{ package_update_apt_package_specs }}"
    state: latest
    allow_downgrade: "{{ package_update_allow_downgrade | bool }}"
  when: not package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Create package update local repo directory
  ansible.builtin.file:
    path: "{{ package_update_repo_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Resolve package update local deb repository source on control
  ansible.builtin.set_fact:
    package_update_repo_source_resolved: >-
      {{
        package_update_repo_source
        if package_update_repo_source.startswith('/')
        else playbook_dir ~ '/../' ~ package_update_repo_source
      }}
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Check package update local deb repository source
  ansible.builtin.stat:
    path: "{{ package_update_repo_source_resolved }}"
  register: package_update_repo_source_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Validate package update local deb repository source
  ansible.builtin.assert:
    that:
      - package_update_repo_source_stat.stat.exists
      - package_update_repo_source_stat.stat.isdir
    fail_msg: >-
      Package update local repo source not found on the Ansible controller:
      {{ package_update_repo_source_resolved }}. Build/copy the offline bundle
      with repo/update included before running package_update.
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Find package update local deb repository source packages
  ansible.builtin.find:
    paths: "{{ package_update_repo_source_resolved }}"
    patterns: "*.deb"
    file_type: file
  register: package_update_repo_source_debs
  delegate_to: localhost
  become: false
  run_once: true
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Validate package update local deb repository source packages
  ansible.builtin.assert:
    that:
      - package_update_repo_source_debs.matched | int > 0
    fail_msg: >-
      No .deb files found in package update local repo source on the Ansible
      controller: {{ package_update_repo_source_resolved }}. Run
      ./scripts/build-offline-bundle.sh on the online build machine so
      repo/update is populated before deploying offline.
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Copy package update local deb repository
  ansible.builtin.copy:
    src: "{{ package_update_repo_source_resolved }}/"
    dest: "{{ package_update_repo_dest }}/"
    owner: root
    group: root
    mode: preserve
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Find local deb packages
  ansible.builtin.shell: |
    set -euo pipefail
    package_name="{{ item.name }}"
    package_version="{{ item.version | default('') }}"
    found=""
    found_version=""
    shopt -s nullglob
    for deb in "{{ package_update_repo_dest }}"/"${package_name}"_*.deb; do
      deb_name="$(dpkg-deb -f "${deb}" Package)"
      deb_version="$(dpkg-deb -f "${deb}" Version)"
      if [[ "${deb_name}" != "${package_name}" ]]; then
        continue
      fi
      if [[ -n "${package_version}" ]]; then
        if [[ "${deb_version}" == "${package_version}" ]]; then
          found="${deb}"
          found_version="${deb_version}"
          break
        fi
      elif [[ -z "${found}" ]] || dpkg --compare-versions "${deb_version}" gt "${found_version}"; then
        found="${deb}"
        found_version="${deb_version}"
      fi
    done
    if [[ -z "${found}" ]]; then
      if [[ -n "${package_version}" ]]; then
        echo "Missing ${package_name}=${package_version} in {{ package_update_repo_dest }}" >&2
      else
        echo "Missing latest local deb for ${package_name} in {{ package_update_repo_dest }}" >&2
      fi
      exit 1
    fi
    printf '%s\n' "${found}"
  args:
    executable: /bin/bash
  register: package_update_local_deb_find
  changed_when: false
  loop: "{{ package_update_packages }}"
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Install package updates from local deb files
  ansible.builtin.command:
    argv: >-
      {{
        ['apt-get', 'install', '-y']
        + (['--allow-downgrades'] if package_update_allow_downgrade | bool else [])
        + (package_update_local_deb_find.results | map(attribute='stdout') | list)
      }}
  when: package_update_install_from_local_repo | bool
  tags:
    - package_update

- name: Check installed package versions
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - "{{ item.name }}"
  register: package_update_version_check
  changed_when: false
  loop: "{{ package_update_packages }}"
  tags:
    - package_update

- name: Assert fixed package versions
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.version
    fail_msg: "Package {{ item.item.name }} version is {{ item.stdout }}, expected {{ item.item.version }}"
  loop: "{{ package_update_version_check.results }}"
  when: item.item.version is defined and item.item.version | string | length > 0
  tags:
    - package_update

- name: Print installed latest package versions
  ansible.builtin.debug:
    msg: "Package {{ item.item.name }} installed version: {{ item.stdout }}"
  loop: "{{ package_update_version_check.results }}"
  when: item.item.version is not defined or item.item.version | string | length == 0
  tags:
    - package_update

- name: Find package update installation directory contents for cleanup
  ansible.builtin.find:
    paths: "{{ package_update_installation_dir }}"
    file_type: any
    hidden: true
    recurse: false
  register: package_update_installation_cleanup_items
  when:
    - package_update_install_from_local_repo | bool
    - package_update_cleanup_installation_dir | bool
  tags:
    - package_update

- name: Clear package update installation directory after install
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ package_update_installation_cleanup_items.files | default([]) }}"
  when:
    - package_update_install_from_local_repo | bool
    - package_update_cleanup_installation_dir | bool
  tags:
    - package_update
