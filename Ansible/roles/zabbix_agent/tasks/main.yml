---
- name: Validate Zabbix agent configuration
  ansible.builtin.assert:
    that:
      - zabbix_agent_server_host | length > 0
      - zabbix_agent_hostname | length > 0
      - zabbix_agent_packages is sequence
      - "'zabbix-agent2' in zabbix_agent_packages"
      - "'zabbix-agent' not in zabbix_agent_packages"
      - zabbix_agent_service_name == "zabbix-agent2"
    fail_msg: >-
      Set zabbix_agent_server_host and zabbix_agent_hostname, keep
      zabbix-agent2 in zabbix_agent_packages, do not install legacy
      zabbix-agent, and keep zabbix_agent_service_name=zabbix-agent2.
  tags:
    - zabbix
    - zabbix_agent

- name: Stop legacy Zabbix agent service before migration
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ zabbix_agent_legacy_services }}"
  failed_when: false
  when: zabbix_agent_remove_legacy_agent | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Remove legacy Zabbix agent packages before Agent 2 install
  become: true
  ansible.builtin.apt:
    name: "{{ zabbix_agent_legacy_packages }}"
    state: absent
    purge: true
    autoremove: true
  when: zabbix_agent_remove_legacy_agent | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Download Zabbix apt repository package
  become: true
  ansible.builtin.get_url:
    url: "{{ zabbix_agent_release_url }}"
    dest: "{{ zabbix_agent_release_package_path }}"
    mode: "0644"
  when:
    - zabbix_agent_manage_apt_repo | bool
    - not zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Install Zabbix apt repository package
  become: true
  ansible.builtin.apt:
    deb: "{{ zabbix_agent_release_package_path }}"
  when:
    - zabbix_agent_manage_apt_repo | bool
    - not zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Update apt cache for Zabbix agent
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: not zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Install Zabbix agent from apt repositories
  become: true
  ansible.builtin.apt:
    name: "{{ zabbix_agent_packages }}"
    state: present
  when: not zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Create Zabbix local repo directory
  become: true
  ansible.builtin.file:
    path: "{{ zabbix_agent_repo_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Resolve Zabbix local deb repository source on control
  ansible.builtin.set_fact:
    zabbix_agent_repo_source_resolved: >-
      {{
        zabbix_agent_repo_source
        if zabbix_agent_repo_source.startswith('/')
        else playbook_dir ~ '/../' ~ zabbix_agent_repo_source
      }}
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Check Zabbix local deb repository source
  ansible.builtin.stat:
    path: "{{ zabbix_agent_repo_source_resolved }}"
  register: zabbix_agent_repo_source_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Copy Zabbix local deb repository
  become: true
  ansible.builtin.copy:
    src: "{{ zabbix_agent_repo_source_resolved }}/"
    dest: "{{ zabbix_agent_repo_dest }}/"
    owner: root
    group: root
    mode: preserve
  when:
    - zabbix_agent_install_from_local_repo | bool
    - zabbix_agent_repo_source_stat.stat.exists
  tags:
    - zabbix
    - zabbix_agent

- name: Find Zabbix deb packages
  become: true
  ansible.builtin.find:
    paths: "{{ zabbix_agent_repo_dest }}"
    patterns: "*.deb"
    file_type: file
  register: zabbix_agent_local_debs
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Validate Zabbix local deb repository
  ansible.builtin.assert:
    that:
      - zabbix_agent_local_debs.matched | int > 0
      - >-
        zabbix_agent_local_debs.files
        | map(attribute='path')
        | select('search', '/zabbix-agent2_[^/]*\\.deb$')
        | list
        | length > 0
    fail_msg: >-
      No zabbix-agent2 .deb files found in {{ zabbix_agent_repo_dest }} on
      {{ inventory_hostname }}. The control source {{ zabbix_agent_repo_source_resolved }}
      is {{ 'available' if zabbix_agent_repo_source_stat.stat.exists else 'missing' }}.
      Add zabbix-agent2 and its dependency .deb files to the control repo or
      preload them on this host before running offline.
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Install Zabbix agent from local deb repository
  become: true
  ansible.builtin.shell: >-
    apt-get install -y
    {{ zabbix_agent_local_debs.files | map(attribute='path') | sort | map('quote') | join(' ') }}
  args:
    executable: /bin/bash
  when: zabbix_agent_install_from_local_repo | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Configure Zabbix server
  become: true
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_config_file }}"
    regexp: "^Server="
    line: "Server={{ zabbix_agent_server_host }}"
    backup: true
  notify: Restart zabbix agent
  tags:
    - zabbix
    - zabbix_agent

- name: Configure Zabbix active server
  become: true
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_config_file }}"
    regexp: "^ServerActive="
    line: "ServerActive={{ zabbix_agent_server_active }}"
    backup: true
  notify: Restart zabbix agent
  tags:
    - zabbix
    - zabbix_agent

- name: Configure Zabbix agent hostname
  become: true
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_config_file }}"
    regexp: "^Hostname="
    line: "Hostname={{ zabbix_agent_hostname }}"
    backup: true
  notify: Restart zabbix agent
  tags:
    - zabbix
    - zabbix_agent

- name: Enable and start Zabbix agent
  become: true
  ansible.builtin.systemd:
    name: "{{ zabbix_agent_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - zabbix
    - zabbix_agent
