      ansible.builtin.systemd:
        name: kesl
        state: started
      failed_when: false
      tags:
        - kesl_start
  tags:
    - kesl_start

- name: Enable KESL service
  hosts: "{{ lookup('env', 'ANSIBLE_KESL_ENABLE_TARGET_GROUP') | default('all_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Enable kesl service
      ansible.builtin.systemd:
        name: kesl
        enabled: true
      failed_when: false
      tags:
        - kesl_enable
  tags:
    - kesl_enable

