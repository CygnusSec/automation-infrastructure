---
- name: Prepare base Ubuntu hosts
  hosts: "{{ lookup('env', 'ANSIBLE_PREREQUISITE_TARGET_GROUP') | default('all_targets', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - prerequisite
  roles:
    - prerequisite
  tags:
    - prerequisite

- name: Install Docker runtime
  hosts: "{{ lookup('env', 'ANSIBLE_DOCKER_TARGET_GROUP') | default('linux', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - docker
  roles:
    - docker
  tags:
    - docker

- name: Manage hostnames
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - hostname
  roles:
    - role: hostname
      when: hostname_manage | bool
  tags:
    - hostname

- name: Manage static network settings
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - network
  roles:
    - role: network
      when: network_manage | bool
  tags:
    - network

- name: Configure common iptables rules
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: iptables
      when: iptables_enabled | bool
  tags:
    - iptable
    - iptables

- name: Save common iptables and ipsets
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Save common iptables and ipsets for netfilter-persistent
      ansible.builtin.include_role:
        name: iptables
        tasks_from: save
      tags:
        - iptables_save
  tags:
    - iptables_save

- name: Accept common iptables INPUT and OUTPUT policies
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Accept iptables INPUT and OUTPUT policies
      ansible.builtin.include_role:
        name: iptables
        tasks_from: accept
      tags:
        - iptable_accept
        - iptables_accept
  tags:
    - iptable_accept
    - iptables_accept

- name: Block common iptables INPUT and OUTPUT policies
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Block iptables INPUT and OUTPUT policies
      ansible.builtin.include_role:
        name: iptables
        tasks_from: block
      when: iptables_block_enabled | bool
      tags:
        - iptable_block
        - iptables_block
  tags:
    - iptable_block
    - iptables_block

- name: Apply targeted package and CVE updates
  hosts: "{{ lookup('env', 'ANSIBLE_PACKAGE_UPDATE_TARGET_GROUP') | default('package_update_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: package_update
      when: package_update_enabled | bool
      tags:
        - package_update
        - cve_update
  tags:
    - package_update
    - cve_update

- name: Remove python3-pip package
  hosts: "{{ lookup('env', 'ANSIBLE_PYTHON3_PIP_REMOVE_TARGET_GROUP') | default('package_update_targets', true) }}"
  gather_facts: false
  become: true
  vars:
    python3_pip_remove_packages: "{{ lookup('env', 'ANSIBLE_PYTHON3_PIP_REMOVE_PACKAGES') | default('[python3-pip]', true) | from_yaml }}"
    python3_pip_remove_purge: "{{ (lookup('env', 'ANSIBLE_PYTHON3_PIP_REMOVE_PURGE') | default('false', true)) | bool }}"
    python3_pip_remove_autoremove: "{{ (lookup('env', 'ANSIBLE_PYTHON3_PIP_REMOVE_AUTOREMOVE') | default('true', true)) | bool }}"
  tasks:
    - name: Remove python3-pip packages
      ansible.builtin.apt:
        name: "{{ python3_pip_remove_packages }}"
        state: absent
        purge: "{{ python3_pip_remove_purge }}"
        autoremove: "{{ python3_pip_remove_autoremove }}"
      tags:
        - python3_pip_remove
        - cve_python3_pip_remove
  tags:
    - python3_pip_remove
    - cve_python3_pip_remove

- name: Change local user password
  hosts: "{{ lookup('env', 'ANSIBLE_USER_PASSWORD_TARGET_GROUP') | default('all_targets', true) }}"
  gather_facts: false
  become: true
  vars:
    user_password_username: "{{ lookup('env', 'ANSIBLE_USER_PASSWORD_USERNAME') | default('', true) }}"
    user_password_value: "{{ lookup('env', 'ANSIBLE_USER_PASSWORD_VALUE') | default('', true) }}"
  tasks:
    - name: Validate local user password inputs
      ansible.builtin.assert:
        that:
          - user_password_username | length > 0
          - user_password_value | length > 0
          - user_password_username is match('^[a-z_][a-z0-9_-]*[$]?$')
        fail_msg: "Set ANSIBLE_USER_PASSWORD_USERNAME and ANSIBLE_USER_PASSWORD_VALUE before running user_password."
      no_log: true
      tags:
        - user_password

    - name: Change local user password with chpasswd
      ansible.builtin.command:
        cmd: chpasswd
        stdin: "{{ user_password_username }}:{{ user_password_value }}"
      changed_when: true
      no_log: true
      tags:
        - user_password
  tags:
    - user_password

- name: Clean installation staging directory
  hosts: "{{ lookup('env', 'ANSIBLE_INSTALLATION_CLEANUP_TARGET_GROUP') | default('all_targets', true) }}"
  gather_facts: false
  become: true
  vars:
    installation_cleanup_dir: "{{ lookup('env', 'ANSIBLE_INSTALLATION_CLEANUP_DIR') | default('/media/installation', true) }}"
  tasks:
    - name: Validate installation cleanup directory
      ansible.builtin.assert:
        that:
          - installation_cleanup_dir == '/media/installation'
        fail_msg: "Refusing to clean unexpected directory: {{ installation_cleanup_dir }}"
      tags:
        - never
        - installation_cleanup

    - name: Find installation staging directory contents
      ansible.builtin.find:
        paths: "{{ installation_cleanup_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: installation_cleanup_items
      tags:
        - never
        - installation_cleanup

    - name: Clean installation staging directory contents
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ installation_cleanup_items.files | default([]) }}"
      tags:
        - never
        - installation_cleanup

    - name: Ensure installation staging directory exists
      ansible.builtin.file:
        path: "{{ installation_cleanup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - never
        - installation_cleanup
  tags:
    - never
    - installation_cleanup

