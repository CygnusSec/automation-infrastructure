---
- name: Prepare base Ubuntu hosts
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - base
        - prerequisite
        - docker
  roles:
    - prerequisite
    - docker
  tags:
    - base

- name: Manage hostnames
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - hostname
  roles:
    - role: hostname
      when: hostname_manage | bool
  tags:
    - hostname

- name: Manage static network settings
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - network
  roles:
    - role: network
      when: network_manage | bool
  tags:
    - network

- name: Configure common iptables rules
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: iptables
      when: iptables_enabled | bool
  tags:
    - iptable
    - iptables
    - iptables_save

- name: Block common iptables INPUT and OUTPUT
  hosts: "{{ lookup('env', 'ANSIBLE_IPTABLES_TARGET_GROUP') | default('iptables_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Block iptables INPUT and OUTPUT chains
      ansible.builtin.include_role:
        name: iptables
        tasks_from: block
      when: iptables_block_enabled | bool
      tags:
        - iptable_block
        - iptables_block
        - iptables_save
  tags:
    - iptable_block
    - iptables_block
    - iptables_save

- name: Apply targeted package updates
  hosts: "{{ lookup('env', 'ANSIBLE_PACKAGE_UPDATE_TARGET_GROUP') | default('package_update_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: package_update
      when: package_update_enabled | bool
  tags:
    - package_update

- name: Install Zabbix server
  hosts: "{{ lookup('env', 'ANSIBLE_ZABBIX_SERVER_TARGET_GROUP') | default('zabbix_server_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: zabbix_server
      when: zabbix_server_enabled | bool
  tags:
    - zabbix
    - zabbix_server

- name: Configure Zabbix agents
  hosts: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_TARGET_GROUP') | default('zabbix_agent_targets', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - zabbix
        - zabbix_agent
  roles:
    - role: zabbix_agent
      when: zabbix_agent_enabled | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Uninstall Zabbix agents
  hosts: "{{ lookup('env', 'ANSIBLE_ZABBIX_AGENT_TARGET_GROUP') | default('zabbix_agent_targets', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Uninstall Zabbix agent packages
      ansible.builtin.include_role:
        name: zabbix_agent
        tasks_from: uninstall
        apply:
          become: true
      tags:
        - zabbix_agent_uninstall
  tags:
    - zabbix_agent_uninstall

- name: Remove native MariaDB server package
  hosts: "{{ lookup('env', 'ANSIBLE_MARIADB_REMOVE_TARGET_GROUP') | default('all_targets', true) }}"
  gather_facts: false
  become: true
  vars:
    mariadb_remove_packages: "{{ lookup('env', 'ANSIBLE_MARIADB_REMOVE_PACKAGES') | default('[mariadb-server]', true) | from_yaml }}"
    mariadb_remove_services: "{{ lookup('env', 'ANSIBLE_MARIADB_REMOVE_SERVICES') | default('[mariadb, mysql]', true) | from_yaml }}"
    mariadb_remove_purge: "{{ (lookup('env', 'ANSIBLE_MARIADB_REMOVE_PURGE') | default('true', true)) | bool }}"
    mariadb_remove_autoremove: "{{ (lookup('env', 'ANSIBLE_MARIADB_REMOVE_AUTOREMOVE') | default('true', true)) | bool }}"
  tasks:
    - name: Stop native MariaDB services before package removal
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ mariadb_remove_services }}"
      failed_when: false
      tags:
        - mariadb_remove

    - name: Remove native MariaDB packages
      become: true
      ansible.builtin.apt:
        name: "{{ mariadb_remove_packages }}"
        state: absent
        purge: "{{ mariadb_remove_purge }}"
        autoremove: "{{ mariadb_remove_autoremove }}"
      tags:
        - mariadb_remove
  tags:
    - mariadb_remove

- name: Configure Dockerized DNS and time servers
  hosts: "{{ lookup('env', 'ANSIBLE_DNS_TIME_SERVICES_TARGET_GROUP') | default('dns_time_servers', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - dns_time_services
        - dns_server
        - time_server
  roles:
    - role: dns_time_services
      when: dns_time_services_enabled | bool
  tags:
    - dns_time_services
    - dns_server
    - time_server

- name: Configure NTP clients
  hosts: "{{ lookup('env', 'ANSIBLE_NTP_CLIENT_TARGET_GROUP') | default('all_targets:!dns_time_servers', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - ntp_client
  roles:
    - role: ntp_client
      when: ntp_client_enabled | bool
  tags:
    - ntp_client

- name: Deploy TLDH database
  hosts: "{{ lookup('env', 'ANSIBLE_TLDH_DATABASE_TARGET_GROUP') | default('tldh_database_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: tldh_database
      when: tldh_database_enabled | bool
  tags:
    - tldh_database

- name: Mount external disks
  hosts: "{{ lookup('env', 'ANSIBLE_EXTERNAL_DISK_TARGET_GROUP') | default('external_disk_targets', true) }}"
  gather_facts: false
  become: true
  roles:
    - role: external_disk
      when: external_disk_enabled | bool
  tags:
    - external_disk

- name: Configure Docker Swarm
  hosts: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_TARGET_GROUP') | default('swarm_managers:swarm_workers', true) }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - docker_swarm
  roles:
    - role: docker_swarm
      when: docker_swarm_enabled | bool
  tags:
    - docker_swarm

- name: Leave Docker Swarm
  hosts: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_TARGET_GROUP') | default('swarm_managers:swarm_workers', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Leave Docker Swarm
      ansible.builtin.include_role:
        name: docker_swarm
        tasks_from: leave
      when: docker_swarm_enabled | bool
      tags:
        - docker_swarm_leave
  tags:
    - docker_swarm_leave

- name: Configure Docker Swarm iptables
  hosts: "{{ lookup('env', 'ANSIBLE_DOCKER_SWARM_TARGET_GROUP') | default('swarm_managers:swarm_workers', true) }}"
  gather_facts: false
  become: true
  tasks:
    - name: Configure Docker Swarm iptables rules
      ansible.builtin.include_role:
        name: docker_swarm
        tasks_from: iptables
      when: docker_swarm_manage_iptables | bool
      tags:
        - docker_swarm_iptables
        - docker_swarm_iptables_ipsets
        - docker_swarm_iptables_nodes
        - docker_swarm_iptables_allow_connect_in
        - docker_swarm_iptables_allow_connect_out
        - docker_swarm_iptables_docker_user_drop
        - docker_swarm_iptables_save
  tags:
    - docker_swarm_iptables
    - docker_swarm_iptables_ipsets
    - docker_swarm_iptables_nodes
    - docker_swarm_iptables_allow_connect_in
    - docker_swarm_iptables_allow_connect_out
    - docker_swarm_iptables_docker_user_drop
    - docker_swarm_iptables_save
