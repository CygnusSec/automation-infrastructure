---
- name: Prepare base Ubuntu hosts
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - base
        - prerequisite
        - docker
  roles:
    - prerequisite
    - docker
  tags:
    - base

- name: Manage hostnames
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - hostname
  roles:
    - role: hostname
      when: hostname_manage | bool
  tags:
    - hostname

- name: Manage static network settings
  hosts: linux
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - network
  roles:
    - role: network
      when: network_manage | bool
  tags:
    - network

- name: Configure Zabbix agents
  hosts: "{{ zabbix_agent_target_group | default('linux') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - zabbix
        - zabbix_agent
  roles:
    - role: zabbix_agent
      when: zabbix_agent_enabled | bool
  tags:
    - zabbix
    - zabbix_agent

- name: Uninstall Zabbix agents
  hosts: "{{ zabbix_agent_target_group | default('linux') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Uninstall Zabbix agent packages
      ansible.builtin.include_role:
        name: zabbix_agent
        tasks_from: uninstall
      tags:
        - zabbix_agent_uninstall
  tags:
    - zabbix_agent_uninstall

- name: Configure Dockerized DNS and time servers
  hosts: "{{ dns_time_services_target_group | default('dns_time_servers') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - dns_time_services
        - dns_server
        - time_server
  roles:
    - role: dns_time_services
      when: dns_time_services_enabled | bool
  tags:
    - dns_time_services
    - dns_server
    - time_server

- name: Configure NTP clients
  hosts: "{{ ntp_client_target_group | default('all_targets:!dns_time_servers') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - ntp_client
  roles:
    - role: ntp_client
      when: ntp_client_enabled | bool
  tags:
    - ntp_client

- name: Mount external disks
  hosts: "{{ external_disk_target_group | default('external_disk_targets') }}"
  gather_facts: false
  become: true
  roles:
    - role: external_disk
      when: external_disk_enabled | bool
  tags:
    - external_disk

- name: Configure Docker Swarm
  hosts: "{{ docker_swarm_target_group | default('swarm_managers:swarm_workers') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - docker_swarm
  roles:
    - role: docker_swarm
      when: docker_swarm_enabled | bool
  tags:
    - docker_swarm

- name: Configure Docker Swarm iptables
  hosts: "{{ docker_swarm_target_group | default('swarm_managers:swarm_workers') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Configure Docker Swarm iptables rules
      ansible.builtin.include_role:
        name: docker_swarm
        tasks_from: iptables
      when: docker_swarm_manage_iptables | bool
      tags:
        - docker_swarm_iptables
  tags:
    - docker_swarm_iptables
